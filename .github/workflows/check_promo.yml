name: Check promo

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Identifiants produit (séparés par des espaces)'
        required: true
        default: 'product-lazaria-v7004-40'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python check_promo.py ${{ github.event.inputs.ids }}
