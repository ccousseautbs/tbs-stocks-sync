name: Flux TBS (stocks, contenu, enrichissement GMC)

on:
  schedule:
    - cron: '0 1 * * *'   # STOCKS : 2h heure de Paris l'hiver / 3h l'été → récupérations GMC à 5h
    - cron: '0 10 * * *'  # CONTENU : 11h l'hiver / 12h l'été, après la remise à zéro du quota Gemini (9h)
  workflow_dispatch:
    inputs:
      perimetre:
        description: "Que lancer ? (contenu et tout consomment le quota Gemini du jour)"
        type: choice
        options: [stocks, contenu, tout]
        default: stocks

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: flux-tbs
  cancel-in-progress: false

jobs:
  # ── JOB 1 : lecture unique des flux Lengow ─────────────────
  lecture-flux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Télécharger flux canal Google + catalogue
        run: python fetch_flux.py
      - uses: actions/upload-artifact@v4
        with:
          name: flux
          path: cache/
          retention-days: 2

  # ── JOB 2 : stocks magasin ─────────────────────────────────
  stocks:
    needs: lecture-flux
    if: github.event.schedule == '0 1 * * *' || inputs.perimetre == 'stocks' || inputs.perimetre == 'tout'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: flux
          path: cache/
      - name: Stocks sync
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python stocks_sync.py
      - uses: actions/upload-artifact@v4
        with:
          name: sortie-stocks
          path: |
            docs/inventaire_magasin.csv
            docs/exclusions_locales_gmc.csv
          if-no-files-found: warn
          retention-days: 2

  # ── JOB 3 : contenu éditorial (référentiel descriptions) ───
  descriptions:
    needs: lecture-flux
    if: github.event.schedule == '0 10 * * *' || inputs.perimetre == 'contenu' || inputs.perimetre == 'tout'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: flux
          path: cache/
      - name: Générer la source descriptions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python descriptions.py
      - name: Enregistrer le référentiel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/referentiel_descriptions.csv
          git diff --cached --quiet || (git commit -m "Référentiel descriptions $(date +%F)" && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: sortie-descriptions
          path: docs/rapports/descriptions_*.csv
          retention-days: 2

  # ── JOB 4 : enrichissement GMC (source supplémentaire unique) ─
  conversationnel:
    needs: [lecture-flux, descriptions]
    if: always() && needs.lecture-flux.result == 'success' && (github.event.schedule == '0 10 * * *' || inputs.perimetre == 'contenu' || inputs.perimetre == 'tout')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # récupère le référentiel descriptions commité par le job 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: flux
          path: cache/
      - name: Générer le fichier d'enrichissement GMC
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python conversationnel.py
      - name: Enregistrer le référentiel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/referentiel_qr.csv
          git diff --cached --quiet || (git commit -m "Référentiel Q&R $(date +%F)" && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: sortie-conversationnel
          path: |
            docs/enrichissement_gmc.tsv
            docs/rapports/qr_*.csv
          retention-days: 2

  # ── JOB 5 : publication GitHub Pages ───────────────────────
  publication:
    needs: [lecture-flux, stocks, descriptions, conversationnel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les sorties des jobs
        continue-on-error: true   # un passage « stocks » seul n'a pas de sortie contenu, et inversement
        uses: actions/download-artifact@v4
        with:
          pattern: sortie-*
          merge-multiple: true
          path: site/
      - name: Reprendre la dernière version publiée de tout fichier manquant
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p site/rapports
          for f in inventaire_magasin.csv exclusions_locales_gmc.csv enrichissement_gmc.tsv \
                   rapports/descriptions_a_rediger.csv rapports/descriptions_revue.csv rapports/qr_a_revoir.csv; do
            if [ ! -s "site/$f" ]; then
              echo "⚠️ $f absent cette nuit : reprise de la version publiée"
              curl -sf "$PAGES_URL/$f" -o "site/$f" || { echo "❌ $f introuvable sur Pages"; rm -f "site/$f"; }
            fi
          done
          [ -d docs ] && cp -rn docs/. site/ || true
          ls -la site/ site/rapports/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
      - name: Keepalive
        if: always()
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/stocks_sync.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
